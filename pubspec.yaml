name: serenity_ai
description: SerenityAI - Global Mental Health & Stress Monitoring App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0

  # Camera & Detection
  camera: ^0.10.5
  tflite_flutter: ^0.10.4
  google_mlkit_face_detection: ^0.9.0
  sensors_plus: ^4.0.2
  app_usage: ^4.0.1

  # UI
  fl_chart: ^0.68.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Localization
  easy_localization: ^3.0.7
  intl: ^0.19.0

  # Navigation
  go_router: ^14.0.0

  #Google
  google_sign_in: ^6.2.1

  # Notifications
  flutter_local_notifications: ^17.1.0

  # Payments
  flutter_stripe: ^10.1.1

  # Utils
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.1
  connectivity_plus: ^6.0.3
  dio: ^5.4.3
  logger: ^2.3.0
  uuid: ^4.4.0
  equatable: ^2.0.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/audio/
    - assets/translations/

